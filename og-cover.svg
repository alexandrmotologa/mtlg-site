  <text x="630" y="484" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">DevTools</text>

  <text x="1060" y="485" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="end">mtlg.site ↗</text>
