<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="50%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bubbleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="200" cy="180" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <rect x="70" y="60" width="1060" height="510" rx="24" fill="rgba(15, 20, 35, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Brand Pill Top Left -->
  <rect x="110" y="100" width="320" height="40" rx="20" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <circle cx="130" cy="120" r="6" fill="#38bdf8"/>
  <text x="146" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">VERIFIED FREELANCE ARCHITECT</text>

  <!-- Name / Heading -->
  <text x="110" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Alexandr Motologa</text>
  <text x="110" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#accent)">Full-Stack Engineer • Bubble.io Expert • AI Developer</text>

  <!-- Value Description -->
  <text x="110" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Available for hire on Upwork, Fiverr &amp; Direct Contract. Specialized in visual architectures,
  </text>
  <text x="110" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Bubble.io enterprise apps, low-code &amp; custom full-stack solutions (React, Next.js, Node, Python, AI).
  </text>

  <!-- Capability Badges -->
  <!-- Badge 1: Bubble.io -->
  <rect x="110" y="390" width="220" height="46" rx="10" fill="rgba(2, 132, 199, 0.15)" stroke="rgba(2, 132, 199, 0.4)" stroke-width="1"/>
  <text x="130" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">⚡ Bubble.io Architect</text>

  <!-- Badge 2: Full-Stack -->
  <rect x="345" y="390" width="220" height="46" rx="10" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
  <text x="365" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#818cf8">💻 Full-Stack Dev</text>

  <!-- Badge 3: AI & Low-Code -->
  <rect x="580" y="390" width="230" height="46" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <text x="600" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#06b6d4">🤖 AI &amp; Low-Code Studio</text>

  <!-- Badge 4: Upwork & Fiverr -->
  <rect x="825" y="390" width="260" height="46" rx="10" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
  <text x="845" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#4ade80">⭐ Hire on Upwork &amp; Fiverr</text>

  <!-- Footer Stats / URL -->
  <line x1="110" y1="475" x2="1080" y2="475" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="600" fill="#64748b">40+ PRODUCTION APPS DELIVERED</text>
  <text x="960" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="700" fill="#38bdf8">mtlg.site ↗</text>
</svg>