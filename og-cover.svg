  <!-- Subtitle -->
  <text x="130" y="295" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="url(#accentGrad)">&lt;Full-Stack &amp; AI Developer // No-Code Specialist&gt;</text>

