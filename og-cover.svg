  <text x="170" y="147" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#6ee7b7" letter-spacing="1">SOFTWARE ENGINEER &amp; ARCHITECT</text>

